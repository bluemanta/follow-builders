name: Deploy Daily Visual Digest to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'feed-*.json'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    # Runs daily at 7:00 UTC (15:00 Beijing time), right after feeds are generated at 6:17 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync latest feeds from upstream
        run: |
          echo "Syncing latest feeds from upstream zarazhangrui/follow-builders..."
          curl -fsSL https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-x.json -o feed-x.json || true
          curl -fsSL https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-podcasts.json -o feed-podcasts.json || true
          curl -fsSL https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/feed-blogs.json -o feed-blogs.json || true
          curl -fsSL https://raw.githubusercontent.com/zarazhangrui/follow-builders/main/state-feed.json -o state-feed.json || true

      - name: Commit updated feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-*.json state-feed.json
          git diff --cached --quiet || (git commit -m "chore: auto-sync feeds from upstream [skip ci]" && git push) || true

      - name: Install dependencies
        run: |
          cd scripts && npm install

      - name: Build Visual Digest (HTML & Assets)
        run: |
          cd scripts && npm run render-visual
          touch ../dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
